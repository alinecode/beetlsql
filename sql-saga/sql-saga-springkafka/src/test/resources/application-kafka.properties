spring.datasource.url=jdbc:h2:mem:dbtest1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver


spring.datasource.url2=jdbc:h2:mem:dbtest2;DB_CLOSE_ON_EXIT=FALSE

beetlsql.sqlManagers = sqlManager
beetlsql.sqlManager.dynamic=sqlManager1,sqlManager2
beetlsql.sqlManager.basePackage=org.beetl.sql.springboot.dynamic
beetlsql.sqlManager1.ds=ds1
beetlsql.sqlManager2.ds=ds2


beetlsql.saga.kafka-topic=test002


spring.kafka.bootstrapServers=127.0.0.1:9092
spring.kafka.consumer.group-id=saga
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.type=single
spring.kafka.listener.ack-mode=record

spring.kafka.consumer.value-deserializer=org.beetl.sql.saga.kafka.ByteDeserializer
spring.kafka.producer.value-serializer=org.beetl.sql.saga.kafka.ByteSerializer