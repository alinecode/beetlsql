spring:
  datasource:
    driver-class-name: org.h2.Driver
    password: ''
    url: jdbc:h2:mem:dbtest;DB_CLOSE_ON_EXIT=FALSE
    username: sa


beetlsql.sqlManagers: sqlManager1,sqlManager2
beetlsql:
  sqlManager1:
    basePackage: org.beetl.sql.springboot.datasource2.db1
    daoSuffix: Mapper
    ds: ds1
  sqlManager2:
    basePackage: org.beetl.sql.springboot.datasource2.db2
    daoSuffix: Mapper
    ds: ds2


