beetlsql.sqlManagers = sqlManager1
beetlsql.sqlManager1.ds=ds0
beetlsql.sqlManager1.basePackage=org.beetl.sql.springboot.shardjdbc


spring.shardingsphere.datasource.names=ds0
spring.shardingsphere.datasource.ds0.type=org.apache.commons.dbcp2.BasicDataSource
spring.shardingsphere.datasource.ds0.driver-class-name=org.h2.Driver
spring.shardingsphere.datasource.ds0.url=jdbc:h2:mem:dbtest;DB_CLOSE_ON_EXIT=FALSE
spring.shardingsphere.datasource.ds0.username=sa
spring.shardingsphere.datasource.ds0.password=


spring.shardingsphere.sharding.tables.t_order.actual-data-nodes=ds0.t_order$->{0..1}
spring.shardingsphere.sharding.tables.t_order.table-strategy.inline.sharding-column=order_id
spring.shardingsphere.sharding.tables.t_order.table-strategy.inline.algorithm-expression=t_order$->{order_id % 2}
