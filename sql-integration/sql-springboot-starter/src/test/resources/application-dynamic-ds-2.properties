
spring.datasource.url=jdbc:h2:mem:dbtest;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

beetlsql.sqlManagers = proxySqlManager
beetlsql.proxySqlManager.threadlocal=sqlManagerH2,sqlManagerMySql
beetlsql.proxySqlManager.basePackage=org.beetl.sql.springboot.dynamicds2

beetlsql.sqlManagerH2.ds=ds1
beetlsql.sqlManagerH2.interceptor=org.beetl.sql.springboot.dynamicds.MyDebug
beetlsql.sqlManagerH2.dbStyle=org.beetl.sql.springboot.dynamicds2.DynamicH2Style

beetlsql.sqlManagerMySql.ds=ds1
beetlsql.sqlManagerMySql.interceptor=org.beetl.sql.springboot.dynamicds.MyDebug
beetlsql.sqlManagerMySql.dbStyle=org.beetl.sql.springboot.dynamicds2.DynamicMySqlStyle
